name: Build Souzaiosoficial EXTERNAL unsigned IPA

on:
  push:
    branches: [main, teste-migracao-ipa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (macOS)
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        run: |
          set -euo pipefail
          SELECTED="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$SELECTED"
          xcodebuild -version

      - name: Build for iPhone and iPad
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/build" \
            OBJROOT="$RUNNER_TEMP/build/Intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/Release-iphoneos/3105.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa-stage"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/3105.app"
          IPA="$RUNNER_TEMP/Souzaiosoficial-EXTERNAL-unsigned.ipa"
          (cd "$STAGE" && /usr/bin/zip -qry "$IPA" Payload)
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souzaiosoficial-EXTERNAL-unsigned-ipa
          path: |
            ${{ runner.temp }}/Souzaiosoficial-EXTERNAL-unsigned.ipa
            ${{ runner.temp }}/Souzaiosoficial-EXTERNAL-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
