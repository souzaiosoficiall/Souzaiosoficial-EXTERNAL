name: Build HYper key-enabled IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Give permission to scripts
        run: |
          chmod +x build_unsigned.sh
          chmod +x build_esign_ready_ipa.sh

      - name: Build unsigned IPA
        run: ./build_unsigned.sh

      - name: Prepare eSign ready IPA
        run: ./build_esign_ready_ipa.sh build/HYper-Regedit-Key-Enabled-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HYper-Regedit-Key-Enabled-unsigned-ipa
          path: build/HYper-Regedit-Key-Enabled-unsigned.ipa