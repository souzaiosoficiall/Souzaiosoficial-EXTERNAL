name: Build & Release IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -target 3105 -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Release-iphoneos/3105.app Payload/
          zip -r Souzaiosoficial-3105.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Souzaiosoficial-3105-ipa
          path: Souzaiosoficial-3105.ipa
